name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vicinae/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick shellcheck
      - run: npm ci
        working-directory: vicinae
      - run: npm audit --audit-level=high
        working-directory: vicinae
      - run: npm test && npm run lint && npx tsc --noEmit
        working-directory: vicinae
      - run: shellcheck -x -P . ./*.sh examples/matugen/post-apply.sh
      - run: npm run bundle && npx vici build --out ../release/extension
        working-directory: vicinae
      - run: python3 scripts/prepare-release.py
